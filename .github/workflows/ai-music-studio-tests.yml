name: AI Music Production Studio Tests

on:
  push:
    paths:
      - "ai_music_studio/**"
      - ".github/workflows/ai-music-studio-tests.yml"
  pull_request:
    paths:
      - "ai_music_studio/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run unit tests
        run: pytest ai_music_studio/tests -q
