name: AI Music Production Studio Tests

on:
  push:
    paths:
      - "ai_music_studio/**"
      - ".github/workflows/ai-music-studio-tests.yml"
  pull_request:
    paths:
      - "ai_music_studio/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and test dependencies
        run: python -m pip install -r ai_music_studio/requirements.txt pytest httpx
      - name: Run unit tests
        run: python -m pytest ai_music_studio/tests -q
      - name: Run rhythm tests
        run: node --test ai_music_studio/tests/test_rhythm.js
